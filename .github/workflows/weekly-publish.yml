name: Weekly Article Publish

on:
  schedule:
    # 00:00 UTC 月曜 = 09:00 JST 月曜
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_article.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "reptile-affiliate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles topics_state.json docs
          git diff --staged --quiet || git commit -m "Weekly article publish $(date -u +'%Y-%m-%d')"
          git push
