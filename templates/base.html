<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>{% block title %}{{ site.site_name }}{% endblock %}</title>
<meta name="description" content="{% block meta_description %}{{ site.tagline }}{% endblock %}">
<link rel="canonical" href="{{ site.base_url }}{{ canonical_path }}">
<link rel="stylesheet" href="{{ asset_prefix }}assets/style.css">

<meta property="og:site_name" content="{{ site.site_name }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:url" content="{{ site.base_url }}{{ canonical_path }}">
<meta property="og:title" content="{% block og_title %}{{ site.site_name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ site.tagline }}{% endblock %}">
<meta property="og:locale" content="ja_JP">
{% block og_image %}{% endblock %}

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% block twitter_title %}{{ site.site_name }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ site.tagline }}{% endblock %}">

{% block structured_data %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a class="site-title-row" href="{{ root_prefix }}index.html">
    <svg class="site-title-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2c-.9 2.1-2.6 3.2-4.6 3.6C4.9 6 3 7.9 3 10.5c0 1.8 1 3.3 2.5 4.1-.3.9-.5 1.9-.5 2.9 0 2.5 2.2 4.5 5 4.5s5-2 5-4.5c0-.4 0-.8-.1-1.2 1.8-.5 3.1-2.1 3.1-4 0-1.5-.8-2.8-2-3.5.5-.9.8-1.9.8-3C17.8 3.6 15.2 2 12 2z"/>
    </svg>
    <span class="site-title">{{ site.site_name }}</span>
  </a>
  <p class="site-tagline">{{ site.tagline }}</p>
</header>

<main class="site-main">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p class="disclosure">
    当サイトは、Amazon.co.jpを含むAmazonアソシエイト・プログラムの参加者であり、
    適格販売により収入を得ています。
  </p>
  <p class="footer-links">
    <a href="{{ root_prefix }}privacy.html">プライバシーポリシー・免責事項</a>
  </p>
  <p class="copyright">&copy; {{ current_year }} {{ site.site_name }}</p>
</footer>
</body>
</html>
