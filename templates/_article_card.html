{% macro article_card(article, path_prefix) %}
<article class="article-card">
  <div class="card-badges">
    <span class="genre-badge">{{ article.genre }}</span>
    <span class="format-badge {{ article.format }}">{{ "比較・おすすめ" if article.format == "comparison" else "選び方ガイド" }}</span>
  </div>
  <h2><a href="{{ path_prefix }}articles/{{ article.slug }}.html">{{ article.title }}</a></h2>
  <p class="article-date">{{ article.published_date }}</p>
  <p class="article-excerpt">{{ article.meta_description }}</p>
</article>
{% endmacro %}
